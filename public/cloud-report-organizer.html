<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健保雲端檢驗報告整理工具 (2.0 - 專用版)</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            line-height: 1.6;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #0056b3;
            text-align: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h2 {
            color: #0056b3;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-top: 25px;
        }

        textarea {
            width: 98%;
            height: 250px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 10px;
        }

        .output-area {
            width: 98%;
            height: 400px;
            padding: 10px;
            border: 1px solid #b3d7ff;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 10px;
            background-color: #f8f9fa;
            white-space: pre-wrap;
            overflow-y: auto;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
        }

        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s;
        }

        .action-button:hover {
            background-color: #0056b3;
        }

        .action-button.copy {
            background-color: #28a745;
        }

        .action-button.copy:hover {
            background-color: #1e7e34;
        }

        .action-button.clear {
            background-color: #dc3545;
            margin-left: auto;
        }

        .action-button.clear:hover {
            background-color: #c82333;
        }

        .privacy-notice {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }

        .highlight-high {
            color: #d90429;
            font-weight: bold;
        }

        .highlight-low {
            color: #0077b6;
            font-weight: bold;
        }

        .date-header {
            font-weight: bold;
            color: #0056b3;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .output-header {
            font-weight: bold;
            color: #343a40;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>健保雲端檢驗報告整理工具 (2.0 - 專用版)</h1>
        <p class="privacy-notice">⚠️ 所有資料皆在您的電腦本機處理，不會上傳至任何網路，請安心使用。</p>

        <div>
            <h2>1. 貼上「檢驗報告」原始資料</h2>
            <textarea id="inputData" placeholder="請將從健保雲端系統複製的「檢驗報告」完整文字貼於此處..."></textarea>
            <div class="button-group">
                <button class="action-button" onclick="processData()">整理與分析</button>
                <button class="action-button copy" onclick="copyResult()">一鍵複製結果</button>
                <button class="action-button clear" onclick="clearAll()">全部清除</button>
            </div>
            <h2>2. 整理後結果</h2>
            <div id="outputResult" class="output-area"></div>
        </div>
    </div>

    <script>
        /**
         * Pre-processes raw text by merging broken lines into logical single lines.
         * A new logical line is identified by a starting number pattern.
         * @param {string} rawText The raw text from the textarea.
         * @returns {string[]} An array of cleaned, logical lines.
         */
        function preProcessAndCleanLines(rawText) {
            const rawLines = rawText.split('\n');
            const cleanedLines = [];
            let currentLine = "";

            for (const line of rawLines) {
                // A new record is identified by a line starting with a number (item index).
                if (/^\d+\s/.test(line.trim())) {
                    if (currentLine) {
                        // Push the previously assembled line, replacing multiple whitespaces with a single space.
                        cleanedLines.push(currentLine.replace(/\s+/g, ' ').trim());
                    }
                    // Start a new line.
                    currentLine = line;
                } else {
                    // This is a continuation of the previous line, append it with a space.
                    currentLine += " " + line;
                }
            }
            // Push the last assembled line.
            if (currentLine) {
                cleanedLines.push(currentLine.replace(/\s+/g, ' ').trim());
            }
            return cleanedLines;
        }

        function processData() {
            const rawText = document.getElementById('inputData').value;
            const outputDiv = document.getElementById('outputResult');

            if (!rawText.trim()) {
                outputDiv.innerHTML = '請先貼上資料。';
                return;
            }

            const processedOutput = parseLabData(rawText);
            outputDiv.innerHTML = processedOutput.trim() || '無法解析資料，請確認格式是否正確。';
        }

        function parseLabData(labText) {
            if (!labText.trim()) return '';

            const lines = preProcessAndCleanLines(labText);
            const dataByDate = {};

            const lineRegex = /^\d+\s*(\d{2,3}\/\d{2}\/\d{2})(.+?)(\d+\.?\d+)\s*([a-zA-Z%^/μ\d.\s]+?)(\[.*\])(.*)$/;

            lines.forEach(line => {
                const match = line.match(lineRegex);
                if (!match) return;

                let [, date, nameBlock, result, unitBlock, reference, rest] = match;

                let itemName = nameBlock.split(')').pop().trim();
                itemName = itemName.split('(').pop().trim();
                if (!itemName || itemName.length < 2) {
                    itemName = nameBlock.trim();
                }

                let hospital = "未知來源";
                const categoryKeywords = ["血液學檢查", "生化學檢查", "免疫學檢查", "鏡檢學檢查"];
                let searchStartIndex = 0;

                for (const keyword of categoryKeywords) {
                    const keywordIndex = rest.indexOf(keyword);
                    if (keywordIndex !== -1) {
                        searchStartIndex = keywordIndex + keyword.length;
                        break;
                    }
                }

                if (searchStartIndex > 0) {
                    const sourceCandidate = rest.substring(searchStartIndex);
                    const endMatch = sourceCandidate.match(/住院|門診|\d{8,}/);
                    const endIndex = endMatch ? endMatch.index : sourceCandidate.length;
                    const extractedName = sourceCandidate.substring(0, endIndex).trim();
                    if (extractedName) {
                        hospital = extractedName;
                    }
                }

                let collectionMethod = 'N/A';
                if (rest.includes("Blood") || rest.includes("血液")) {
                    collectionMethod = "Blood";
                } else if (rest.includes("Urine") || rest.includes("尿液")) {
                    collectionMethod = "Urine";
                }

                let unit = unitBlock.replace(unitBlock, unitBlock.split(/\s/)[0]).trim();

                let highLowMark = '', cssClass = '', isAbnormal = false;
                const valueNum = parseFloat(result);
                const rangeStr = reference.replace(/[\[\]]/g, ' ').trim();
                const rangeParts = rangeStr.split(/[-~\s]+/).filter(p => p && !isNaN(p));

                if (rangeParts.length === 2) {
                    const [lower, upper] = [parseFloat(rangeParts[0]), parseFloat(rangeParts[1])];
                    if (!isNaN(lower) && !isNaN(upper)) {
                        if (valueNum > upper) { highLowMark = ' ↑'; cssClass = 'highlight-high'; isAbnormal = true; }
                        else if (valueNum < lower) { highLowMark = ' ↓'; cssClass = 'highlight-low'; isAbnormal = true; }
                    }
                } else {
                    const singleValMatch = rangeStr.match(/[<＜>＞]\s*(\d+\.?\d*)/);
                    if (singleValMatch) {
                        const limit = parseFloat(singleValMatch[1]);
                        if (rangeStr.includes('<') || rangeStr.includes('＜')) {
                            if (valueNum > limit) { highLowMark = ' ↑'; cssClass = 'highlight-high'; isAbnormal = true; }
                        } else if (rangeStr.includes('>') || rangeStr.includes('＞')) {
                            if (valueNum < limit) { highLowMark = ' ↓'; cssClass = 'highlight-low'; isAbnormal = true; }
                        }
                    }
                }

                if (!dataByDate[date]) {
                    dataByDate[date] = { hospital: hospital, items: [] };
                }
                if (dataByDate[date].hospital === "未知來源" && hospital !== "未知來源") {
                    dataByDate[date].hospital = hospital;
                }

                dataByDate[date].items.push({
                    name: itemName,
                    value: result + highLowMark,
                    unit: unit,
                    reference: reference.trim(),
                    method: collectionMethod,
                    cssClass: cssClass,
                    isAbnormal: isAbnormal
                });
            });

            const sortedDates = Object.keys(dataByDate).sort((a, b) => {
                const dateA = new Date(a.replace(/^\d{3}/, y => parseInt(y) + 1911));
                const dateB = new Date(b.replace(/^\d{3}/, y => parseInt(y) + 1911));
                return dateB - dateA;
            });

            let htmlOutput = '';
            sortedDates.forEach(date => {
                const data = dataByDate[date];
                htmlOutput += `<div class="date-header">${date} (${data.hospital})</div>`;

                data.items.forEach(item => {
                    let lineContent = `${item.name} ${item.value} ${item.unit} ${item.reference} ${item.method}`;
                    if (item.isAbnormal) {
                        lineContent += " (異常)";
                    }
                    const line = `<span class="${item.cssClass}">${lineContent}</span>`;
                    htmlOutput += line + '\n';
                });
                htmlOutput += '\n';
            });
            return htmlOutput;
        }

        function copyResult() {
            const resultDiv = document.getElementById('outputResult');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = resultDiv.innerHTML.replace(/<\/div>|<br>/g, '\n').replace(/<[^>]+>/g, '');
            const textToCopy = tempDiv.innerText.trim();

            if (navigator.clipboard) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert('結果已成功複製到剪貼簿！');
                }).catch(err => fallbackCopy(textToCopy));
            } else {
                fallbackCopy(textToCopy);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                if (document.execCommand('copy')) {
                    alert('結果已成功複製到剪貼簿！');
                } else {
                    alert('複製失敗，您的瀏覽器可能不支援此操作。');
                }
            } catch (err) {
                alert('複製失敗: ' + err);
            }
            document.body.removeChild(textArea);
        }

        function clearAll() {
            document.getElementById('inputData').value = '';
            document.getElementById('outputResult').innerHTML = '';
        }
    </script>

</body>

</html>
