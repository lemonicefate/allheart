<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健保雲端檢驗報告整理工具 (2.5 - 專用版)</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            line-height: 1.6;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #0056b3;
            text-align: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h2 {
            color: #0056b3;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-top: 25px;
        }

        textarea {
            width: 98%;
            height: 250px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 10px;
        }

        .output-area {
            width: 98%;
            height: 400px;
            padding: 10px;
            border: 1px solid #b3d7ff;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 10px;
            background-color: #f8f9fa;
            white-space: pre-wrap;
            overflow-y: auto;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
        }

        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .action-button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s;
        }

        .action-button:hover {
            background-color: #0056b3;
        }

        .action-button.copy {
            background-color: #28a745;
        }

        .action-button.copy:hover {
            background-color: #1e7e34;
        }

        .action-button.dedupe {
            background-color: #6f42c1;
        }

        .action-button.dedupe:hover {
            background-color: #5a359a;
        }

        .action-button.clear {
            background-color: #dc3545;
            margin-left: auto;
        }

        .action-button.clear:hover {
            background-color: #c82333;
        }

        .button-group-bottom {
            margin-top: 15px;
            display: flex;
            justify-content: flex-start;
        }

        .action-button.timeline {
            background-color: #fd7e14;
        }

        .action-button.timeline:hover {
            background-color: #e86a00;
        }

        .privacy-notice {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }

        .highlight-high {
            color: #d90429;
            font-weight: bold;
        }

        .highlight-low {
            color: #0077b6;
            font-weight: bold;
        }

        .date-header {
            font-weight: bold;
            color: #0056b3;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .output-header {
            font-weight: bold;
            color: #343a40;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>健保雲端檢驗報告整理工具 (2.5 - 專用版)</h1>
        <p class="privacy-notice">⚠️ 所有資料皆在您的電腦本機處理，不會上傳至任何網路，請安心使用。</p>
        <div>
            <h2>1. 貼上「檢驗報告」原始資料</h2>
            <textarea id="inputData" placeholder="請將從健保雲端系統複製的「檢驗報告」完整文字貼於此處..."></textarea>
            <div class="button-group">
                <button class="action-button" onclick="processData()">整理與分析</button>
                <button class="action-button copy" onclick="copyResult('outputResult')">複製整理結果</button>
                <button class="action-button dedupe" onclick="removeDuplicates()">去除重複項目</button>
                <button class="action-button clear" onclick="clearAll()">全部清除</button>
            </div>

            <h2>2. 整理後結果</h2>
            <div id="outputResult" class="output-area"></div>
            <div class="button-group-bottom">
                <button class="action-button timeline" onclick="timelineSort()">時間軸整理</button>
            </div>

            <h2>3. 時間軸整理</h2>
            <div id="timelineResult" class="output-area"></div>
            <div class="button-group-bottom">
                <button class="action-button copy" onclick="copyResult('timelineResult')">複製時間軸結果</button>
            </div>

        </div>
    </div>
    <script>
        // 全域變數，用於儲存由 parseLabData 解析出的結構化資料
        let _labData = {};

        /**
         * Pre-processes raw text by merging broken lines into logical single lines.
         */
        function preProcessAndCleanLines(rawText) {
            const rawLines = rawText.split('\n');
            const cleanedLines = [];
            let currentLine = "";

            for (const line of rawLines) {
                if (/^\d+\s/.test(line.trim())) {
                    if (currentLine) {
                        cleanedLines.push(currentLine.replace(/\s+/g, ' ').trim());
                    }
                    currentLine = line;
                } else {
                    currentLine += " " + line;
                }
            }
            if (currentLine) {
                cleanedLines.push(currentLine.replace(/\s+/g, ' ').trim());
            }
            return cleanedLines;
        }

        /**
         * Main function to process the raw input data and display it sorted by date.
         */
        function processData() {
            const rawText = document.getElementById('inputData').value;
            const outputDiv = document.getElementById('outputResult');

            // 清空舊資料
            _labData = {};
            document.getElementById('timelineResult').innerHTML = '';

            if (!rawText.trim()) {
                outputDiv.innerHTML = '請先貼上資料。';
                return;
            }
            const processedOutput = parseLabData(rawText);
            outputDiv.innerHTML = processedOutput.trim() || '無法解析資料，請確認格式是否正確。';
        }

        /**
         * Parses the lab data text, generates HTML output, and stores structured data globally.
         */
        function parseLabData(labText) {
            if (!labText.trim()) return '';

            const lines = preProcessAndCleanLines(labText);
            const dataByDate = {};
            const lineRegex = /^\d+\s*(\d{2,3}\/\d{2}\/\d{2})(.+?)(\d+\.?\d+)\s*([a-zA-Z%^/μ\d.\s]+?)(\[.*\])(.*)$/;

            lines.forEach(line => {
                const match = line.match(lineRegex);
                if (!match) return;

                let [, date, nameBlock, result, unitBlock, reference, rest] = match;
                let itemName = nameBlock.split(')').pop().trim();
                itemName = itemName.split('(').pop().trim();
                if (!itemName || itemName.length < 2) {
                    itemName = nameBlock.trim();
                }

                let hospital = "未知來源";
                const categoryKeywords = ["血液學檢查", "生化學檢查", "免疫學檢查", "鏡檢學檢查"];
                let searchStartIndex = 0;

                for (const keyword of categoryKeywords) {
                    const keywordIndex = rest.indexOf(keyword);
                    if (keywordIndex !== -1) {
                        searchStartIndex = keywordIndex + keyword.length;
                        break;
                    }
                }
                if (searchStartIndex > 0) {
                    const sourceCandidate = rest.substring(searchStartIndex);
                    const endMatch = sourceCandidate.match(/住院|門診|\d{8,}/);
                    const endIndex = endMatch ? endMatch.index : sourceCandidate.length;
                    const extractedName = sourceCandidate.substring(0, endIndex).trim();
                    if (extractedName) {
                        hospital = extractedName;
                    }
                }

                let collectionMethod = 'N/A';
                if (rest.includes("Blood") || rest.includes("血液")) {
                    collectionMethod = "Blood";
                } else if (rest.includes("Urine") || rest.includes("尿液")) {
                    collectionMethod = "Urine";
                }

                let unit = unitBlock.replace(unitBlock, unitBlock.split(/\s/)[0]).trim();
                let highLowMark = '', cssClass = '', isAbnormal = false;
                const valueNum = parseFloat(result);
                const rangeStr = reference.replace(/[\[\]]/g, ' ').trim();
                const rangeParts = rangeStr.split(/[-~\s]+/).filter(p => p && !isNaN(p));

                if (rangeParts.length === 2) {
                    const [lower, upper] = [parseFloat(rangeParts[0]), parseFloat(rangeParts[1])];
                    if (!isNaN(lower) && !isNaN(upper)) {
                        if (valueNum > upper) { highLowMark = ' ↑'; cssClass = 'highlight-high'; isAbnormal = true; }
                        else if (valueNum < lower) { highLowMark = ' ↓'; cssClass = 'highlight-low'; isAbnormal = true; }
                    }
                } else {
                    const singleValMatch = rangeStr.match(/[<＜>＞]\s*(\d+\.?\d*)/);
                    if (singleValMatch) {
                        const limit = parseFloat(singleValMatch[1]);
                        if (rangeStr.includes('<') || rangeStr.includes('＜')) {
                            if (valueNum > limit) { highLowMark = ' ↑'; cssClass = 'highlight-high'; isAbnormal = true; }
                        } else if (rangeStr.includes('>') || rangeStr.includes('＞')) {
                            if (valueNum < limit) { highLowMark = ' ↓'; cssClass = 'highlight-low'; isAbnormal = true; }
                        }
                    }
                }

                if (!dataByDate[date]) {
                    dataByDate[date] = { hospital: hospital, items: [] };
                }
                if (dataByDate[date].hospital === "未知來源" && hospital !== "未知來源") {
                    dataByDate[date].hospital = hospital;
                }

                dataByDate[date].items.push({
                    name: itemName,
                    value: result + highLowMark,
                    unit: unit,
                    reference: reference.trim(),
                    method: collectionMethod,
                    cssClass: cssClass,
                    isAbnormal: isAbnormal
                });
            });

            const sortedDates = Object.keys(dataByDate).sort((a, b) => {
                const dateA = new Date(a.replace(/^\d{3}/, y => parseInt(y) + 1911));
                const dateB = new Date(b.replace(/^\d{3}/, y => parseInt(y) + 1911));
                return dateB - dateA;
            });

            // 將解析好的資料存到全域變數
            _labData = dataByDate;

            let htmlOutput = '';
            sortedDates.forEach(date => {
                const data = dataByDate[date];
                htmlOutput += `<div class="date-header">${date} (${data.hospital})</div>\n`;

                data.items.forEach(item => {
                    let lineContent = `${item.name} ${item.value} ${item.unit} ${item.reference} ${item.method}`;
                    if (item.isAbnormal) {
                        lineContent += " (異常)";
                    }
                    const line = `<span class="${item.cssClass}">${lineContent}</span>`;
                    htmlOutput += line + '\n';
                });
                htmlOutput += '\n';
            });
            return htmlOutput;
        }

        /**
         * Copies the text content of a specified result area to the clipboard.
         */
        function copyResult(elementId) {
            const resultDiv = document.getElementById(elementId);
            if (!resultDiv || !resultDiv.innerHTML.trim()) {
                alert('此區塊沒有內容可以複製。');
                return;
            }
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = resultDiv.innerHTML.replace(/<\/div>|<br>/g, '\n').replace(/<[^>]+>/g, '');
            const textToCopy = tempDiv.innerText.trim();

            if (navigator.clipboard) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert('結果已成功複製到剪貼簿！');
                }).catch(err => fallbackCopy(textToCopy));
            } else {
                fallbackCopy(textToCopy);
            }
        }

        /**
         * Fallback copy method for older browsers.
         */
        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                if (document.execCommand('copy')) {
                    alert('結果已成功複製到剪貼簿！');
                } else {
                    alert('複製失敗，您的瀏覽器可能不支援此操作。');
                }
            } catch (err) {
                alert('複製失敗: ' + err);
            }
            document.body.removeChild(textArea);
        }

        /**
         * Clears all input and output areas.
         */
        function clearAll() {
            document.getElementById('inputData').value = '';
            document.getElementById('outputResult').innerHTML = '';
            document.getElementById('timelineResult').innerHTML = '';
            _labData = {}; // 清除暫存的資料
        }

        /**
         * Removes consecutive duplicate lines from the output area.
         */
        function removeDuplicates() {
            const outputDiv = document.getElementById('outputResult');
            const originalHtml = outputDiv.innerHTML;

            if (!originalHtml.trim()) {
                alert('結果區是空的，沒有內容可以處理。');
                return;
            }

            const lines = originalHtml.split('\n');
            const uniqueLines = [];
            let tempDiv = document.createElement('div');

            if (lines.length > 0) {
                uniqueLines.push(lines[0]);
            }

            for (let i = 1; i < lines.length; i++) {
                const prevLineHtml = lines[i - 1];
                const currentLineHtml = lines[i];

                tempDiv.innerHTML = prevLineHtml;
                const prevText = tempDiv.textContent.trim();

                tempDiv.innerHTML = currentLineHtml;
                const currentText = tempDiv.textContent.trim();

                if (currentText === '' || prevText !== currentText) {
                    uniqueLines.push(currentLineHtml);
                }
            }

            tempDiv = null;

            outputDiv.innerHTML = uniqueLines.join('\n');
            alert('重複項目已移除！');
        }

        /**
         * Re-sorts the data by item name from the global _labData object and displays a timeline.
         */
        function timelineSort() {
            const timelineOutputDiv = document.getElementById('timelineResult');

            if (Object.keys(_labData).length === 0) {
                alert('沒有可供整理的資料。請先「整理與分析」。');
                return;
            }

            const itemData = {};

            // 1. 從全域變數 _labData 重新組織資料，改以項目名稱為 key
            for (const date in _labData) {
                const dailyItems = _labData[date].items;
                dailyItems.forEach(item => {
                    const key = `${item.name} (${item.unit})`;
                    if (!itemData[key]) {
                        itemData[key] = [];
                    }
                    itemData[key].push({
                        date: date,
                        value: item.value,
                        cssClass: item.cssClass
                    });
                });
            }

            // 2. 產生時間軸 HTML
            let timelineHtml = '';
            const sortedItemNames = Object.keys(itemData).sort();

            const convertMinguoToDate = (minguoDate) => {
                const parts = minguoDate.split('/');
                if (parts.length !== 3) return new Date(0);
                const year = parseInt(parts[0], 10) + 1911;
                const month = parseInt(parts[1], 10) - 1;
                const day = parseInt(parts[2], 10);
                return new Date(year, month, day);
            };

            sortedItemNames.forEach(name => {
                timelineHtml += `<div><strong>${name}:</strong> `;

                const sortedResults = itemData[name].sort((a, b) => convertMinguoToDate(a.date) - convertMinguoToDate(b.date));

                const resultsHtml = sortedResults.map(res =>
                    `<span class="${res.cssClass}">${res.value}(${res.date})</span>`
                ).join(' → ');

                timelineHtml += resultsHtml + '</div>\n';
            });

            timelineOutputDiv.innerHTML = timelineHtml.trim();
            alert('已產生時間軸檢視！');
        }

    </script>

    <!-- 必要的 JavaScript 文件 -->

    <!-- 初始化頂部欄和側邊欄 -->
    
    <!-- 必要的 JavaScript 文件 -->
    <script src="js/tools-config.js"></script>
    <script src="components/header-sidebar.js"></script>

    <!-- 初始化頂部欄和側邊欄 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initHeaderSidebar({
                currentPage: 'cloud-report-organizer',
                pageTitle: '醫療工具百寶箱'
            });
        });
    </script>
</body>
</html>
